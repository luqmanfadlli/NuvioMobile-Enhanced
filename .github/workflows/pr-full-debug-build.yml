name: PR Full Debug Build

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [enhanced]
  workflow_dispatch:

# Simkl AUTH V2 client ID ("Mobile, desktop & browser apps"). It is public (sent in every API
# URL), so it is pinned here and overrides any SIMKL_CLIENT_ID in NUVIO_LOCAL_PROPERTIES_BASE64.
env:
  SIMKL_CLIENT_ID: "4b4cf9e56b4566b1e1e0e5f54e9adda72a41aba849794eca208092c09f46c4aa"

permissions:
  contents: read

concurrency:
  group: pr-full-debug-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  full-debug-build:
    name: Build fullDebug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Prepare runtime properties
        env:
          LOCAL_PROPERTIES_BASE64: ${{ secrets.NUVIO_LOCAL_PROPERTIES_BASE64 }}
        run: |
          if [ -n "$LOCAL_PROPERTIES_BASE64" ]; then
            printf '%s' "$LOCAL_PROPERTIES_BASE64" | base64 --decode > local.properties
            sed -i -E '/^[[:space:]]*(sdk\.dir|NUVIO_RELEASE_STORE_FILE)[[:space:]]*=/d' local.properties
          else
            touch local.properties
          fi
          # Always use the pinned Simkl AUTH V2 client ID instead of the one in the secret.
          { grep -Ev '^[[:space:]]*SIMKL_CLIENT_ID[[:space:]]*=' local.properties || true
            printf 'SIMKL_CLIENT_ID=%s\n' "${SIMKL_CLIENT_ID}"
          } > local.properties.tmp && mv local.properties.tmp local.properties

      - name: Set up Rust
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android
          cargo install cargo-ndk --locked

      # The runner image doesn't ship this NDK, so AGP downloads it while configuring the project,
      # and a single bad download (e.g. "Archive is not a ZIP archive") fails the whole build.
      # Install it up front with retries instead. Keep in sync with AGP's default NDK version.
      - name: Install Android NDK
        env:
          NDK_VERSION: "28.2.13676358"
        run: |
          sdkmanager="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          ndk_dir="${ANDROID_HOME}/ndk/${NDK_VERSION}"
          log_file="${RUNNER_TEMP:-/tmp}/sdkmanager-ndk.log"
          max_attempts=4
          for attempt in $(seq 1 "${max_attempts}"); do
            if [[ -f "${ndk_dir}/source.properties" ]]; then
              echo "NDK ${NDK_VERSION} is installed."
              exit 0
            fi
            echo "Installing NDK ${NDK_VERSION} (attempt ${attempt}/${max_attempts})"
            if "${sdkmanager}" --install "ndk;${NDK_VERSION}" > "${log_file}" 2>&1 \
              && [[ -f "${ndk_dir}/source.properties" ]]; then
              echo "NDK ${NDK_VERSION} installed."
              exit 0
            fi
            tail -n 20 "${log_file}"
            # Drop partial installs and temp downloads so the next attempt starts clean.
            rm -rf "${ndk_dir}" "${ANDROID_HOME}/.temp"
            if (( attempt < max_attempts )); then
              echo "::warning::NDK ${NDK_VERSION} install failed; retrying in $(( attempt * 15 ))s."
              sleep $(( attempt * 15 ))
            fi
          done
          echo "::error::Failed to install NDK ${NDK_VERSION} after ${max_attempts} attempts."
          exit 1

      - name: Build fullDebug APK
        run: ./gradlew :androidApp:assembleFullDebug -Pnuvio.android.distribution=full -Pnuvio.ios.distribution=appstore --stacktrace

      - name: Upload fullDebug APK
        uses: actions/upload-artifact@v7
        with:
          path: androidApp/build/outputs/apk/full/debug/androidApp-full-debug.apk
          archive: false
          if-no-files-found: error
          retention-days: 7
