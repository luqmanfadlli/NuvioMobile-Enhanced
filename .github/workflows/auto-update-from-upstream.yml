name: Auto-update from upstream

# Every hour: if luqmanfadlli/NuvioMobile-Enhanced has a newer release tag,
# merge it into "enhanced" (keeping our own changes) and start a Release IPA build.
# "Publish IPA for Feather" then publishes the finished IPA.
#
# Needs the AUTO_UPDATE_TOKEN secret: a fine-grained token for this repository
# with Contents, Workflows and Actions set to "Read and write". The built-in
# token cannot push merges that touch workflow files, which upstream often changes.
#
# GitHub runs a schedule on behalf of whoever last changed it. Run this workflow once with
# "refresh_schedule" ticked to re-save the schedule as the AUTO_UPDATE_TOKEN owner.
# Schedule owner: lalith14 (saved 2026-11-10)

on:
  schedule:
    - cron: "18 * * * *"
  workflow_dispatch:
    inputs:
      refresh_schedule:
        description: Re-save the hourly schedule under the token owner's account (only this)
        type: boolean
        default: false
      self_test:
        description: Also test that the token can update workflow files and start builds
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: auto-update-from-upstream
  cancel-in-progress: false

jobs:
  refresh-schedule:
    name: Re-save the schedule under the token owner
    if: inputs.refresh_schedule
    runs-on: ubuntu-latest
    steps:
      - name: Check out enhanced
        uses: actions/checkout@v6
        with:
          ref: enhanced
          token: ${{ secrets.AUTO_UPDATE_TOKEN }}

      - name: Commit the schedule as the token owner
        env:
          GH_TOKEN: ${{ secrets.AUTO_UPDATE_TOKEN }}
        run: |
          login="$(gh api user --jq .login)"
          id="$(gh api user --jq .id)"
          git config user.name "${login}"
          git config user.email "${id}+${login}@users.noreply.github.com"
          f=.github/workflows/auto-update-from-upstream.yml
          # Move the minute between :17 and :18 so the schedule line itself changes.
          if grep -q 'cron: "17 \* \* \* \*"' "${f}"; then minute=18; else minute=17; fi
          sed -i -E "s/cron: \"[0-9]+ \* \* \* \*\"/cron: \"${minute} * * * *\"/" "${f}"
          sed -i "s/^# Schedule owner: .*/# Schedule owner: ${login} (saved $(date -u +%Y-%m-%d))/" "${f}"
          git commit -am "ci: save the hourly upstream check under ${login}"
          git push origin HEAD:enhanced
          # Forks keep schedules off until the owner enables the workflow, so switch it off and on as them.
          gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/auto-update-from-upstream.yml/disable"
          sleep 5
          gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/auto-update-from-upstream.yml/enable"

  sync:
    name: Merge new upstream release and build
    if: ${{ !inputs.refresh_schedule }}
    runs-on: ubuntu-latest
    env:
      UPSTREAM_URL: https://github.com/luqmanfadlli/NuvioMobile-Enhanced.git
      BRANCH: enhanced
      AUTO_UPDATE_TOKEN: ${{ secrets.AUTO_UPDATE_TOKEN }}
    steps:
      - name: Check token
        run: |
          if [[ -z "${AUTO_UPDATE_TOKEN}" ]]; then
            echo "::error::The AUTO_UPDATE_TOKEN secret is missing. Add it in Settings > Secrets and variables > Actions."
            exit 1
          fi
          # Classic tokens report their scopes; fine-grained tokens report none.
          if ! headers="$(GH_TOKEN="${AUTO_UPDATE_TOKEN}" gh api -i "repos/${GITHUB_REPOSITORY}" 2>&1)"; then
            echo "::error::AUTO_UPDATE_TOKEN was rejected by GitHub. It may be expired or revoked; make a new one."
            exit 1
          fi
          scopes="$(printf '%s\n' "${headers}" | tr -d '\r' | awk -F': ' 'tolower($1)=="x-oauth-scopes"{print $2}')"
          if [[ -n "${scopes}" ]]; then
            echo "Token scopes: ${scopes}"
            for needed in repo workflow; do
              if ! tr ', ' '\n\n' <<<"${scopes}" | grep -qx "${needed}"; then
                echo "::error::AUTO_UPDATE_TOKEN is missing the '${needed}' scope."
                exit 1
              fi
            done
          fi

      - name: Check out ${{ env.BRANCH }}
        uses: actions/checkout@v6
        with:
          ref: ${{ env.BRANCH }}
          fetch-depth: 0
          token: ${{ secrets.AUTO_UPDATE_TOKEN }}

      - name: Check push access
        run: git push --dry-run origin "HEAD:${BRANCH}"

      - name: Token self-test
        if: inputs.self_test
        env:
          GH_TOKEN: ${{ secrets.AUTO_UPDATE_TOKEN }}
        run: |
          # Workflows permission: push a throwaway commit that edits a workflow
          # file to a temporary branch, then delete that branch.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c token-selftest
          echo "# token self-test" >> .github/workflows/auto-update-from-upstream.yml
          git commit -qam "token self-test (temporary)"
          if ! git push -q origin HEAD:refs/heads/token-selftest; then
            echo "::error::The token cannot update workflow files. Give it the Workflows permission (or the workflow scope)."
            exit 1
          fi
          git push -q origin --delete token-selftest
          git switch -q -
          echo "Workflows permission: OK"
          # Actions permission: re-enable an already enabled workflow (no effect).
          if ! gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/ios-test-build.yml/enable" >/dev/null; then
            echo "::error::The token cannot start builds. Give it the Actions permission (read and write)."
            exit 1
          fi
          echo "Actions permission: OK"

      - name: Find newest upstream release
        id: find
        run: |
          git fetch --no-tags "${UPSTREAM_URL}" '+refs/tags/*:refs/upstream-tags/*'
          tag="$(git -c versionsort.suffix=-beta for-each-ref --sort=-v:refname \
            --format='%(refname:strip=2)' refs/upstream-tags \
            | grep -E '^[0-9]+\.[0-9]+\.[0-9]+(-beta)?$' | head -n 1)"
          if [[ -z "${tag}" ]]; then
            echo "::error::No release tags found upstream."
            exit 1
          fi
          sha="$(git rev-parse "refs/upstream-tags/${tag}^{commit}")"
          echo "Newest upstream release: ${tag} (${sha})"
          if git merge-base --is-ancestor "${sha}" HEAD; then
            echo "Already up to date with ${tag}."
            echo "update=false" >> "${GITHUB_OUTPUT}"
          else
            echo "update=true" >> "${GITHUB_OUTPUT}"
          fi
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "sha=${sha}" >> "${GITHUB_OUTPUT}"

      - name: Merge ${{ steps.find.outputs.tag }}
        if: steps.find.outputs.update == 'true'
        env:
          TAG: ${{ steps.find.outputs.tag }}
          SHA: ${{ steps.find.outputs.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git merge --no-edit -m "Merge upstream ${TAG} into ${BRANCH}" "${SHA}"; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            if [[ "${conflicts}" == "README.md" ]]; then
              # Our README is our own; keep it whatever upstream changes.
              git checkout --ours README.md
              git add README.md
              git commit --no-edit
            else
              printf '%s\n' "${conflicts}" | sed 's/^/Conflict: /'
              git merge --abort
              echo "::error::Upstream ${TAG} conflicts with our changes. Nothing was pushed; this needs a manual merge."
              exit 1
            fi
          fi
          git push origin "HEAD:${BRANCH}"
          {
            echo "## Merged upstream ${TAG}"
            echo
            echo "A Release IPA build has been started."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Start Release IPA build
        if: steps.find.outputs.update == 'true'
        env:
          GH_TOKEN: ${{ secrets.AUTO_UPDATE_TOKEN }}
        run: |
          gh workflow run ios-test-build.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref "${BRANCH}" \
            -f configuration=Release \
            -f disable_phases=skip-both
