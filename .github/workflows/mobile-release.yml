name: Build Mobile Release
run-name: ${{ inputs.description != '' && format('Build Mobile Release - {0}', inputs.description) || 'Build Mobile Release' }}

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Validate only, create a draft, or publish the release
        required: true
        type: choice
        options:
          - dry-run
          - test-build
          - draft
          - publish
        default: dry-run
      target:
        description: Choose which platform to build
        required: true
        type: choice
        options:
          - all
          - android-only
          - ios-only
        default: all
      description:
        description: Run description
        required: false
        type: string
      exclude_commits:
        description: Optional comma-separated commit hashes to omit from the notes
        required: false
        type: string
      notes_from:
        description: Optional commit to start the release notes after (default - the last "chore(store) publish" commit on this branch)
        required: false
        type: string
      ios_disable_phases:
        description: "iOS Release: Kotlin/Native phases to skip."
        required: false
        type: choice
        default: skip-both
        options:
          - full
          - skip-static-init
          - skip-devirtualization
          - skip-both

permissions:
  contents: read

concurrency:
  group: mobile-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare ${{ inputs.mode }} release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_PROPERTIES_BASE64: ${{ secrets.NUVIO_LOCAL_PROPERTIES_BASE64 }}
      RELEASE_KEYSTORE_BASE64: ${{ secrets.NUVIO_RELEASE_KEYSTORE_BASE64 }}
      CONTRIBUTIONS_URL: https://api.github.com/repos/luqmanfadlli/NuvioMobile-Enhanced/contributors?per_page=100

    steps:
      - name: Check out full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Read release metadata
        id: release
        run: ./scripts/release-metadata.sh "${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"

      - name: Validate release state
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          CURRENT_BUMP: ${{ steps.release.outputs.current_bump }}
          RELEASE_COMMIT: ${{ steps.release.outputs.release_commit }}
          RELEASE_BRANCH: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_MODE: ${{ inputs.mode }}
        run: |
          if [[ "${RELEASE_REF_TYPE}" != "branch" ]]; then
            echo "Releases must be dispatched from a branch, not ${RELEASE_REF_TYPE}." >&2
            exit 1
          fi
          if [[ "${RELEASE_MODE}" == "draft" || "${RELEASE_MODE}" == "publish" ]]; then
            if [[ "${RELEASE_BRANCH}" != "${DEFAULT_BRANCH}" ]]; then
              echo "Mode '${RELEASE_MODE}' creates a tag, so it must be dispatched from the default branch (${DEFAULT_BRANCH})." >&2
              echo "Use mode 'test-build' to build '${RELEASE_BRANCH}' without tagging." >&2
              exit 1
            fi
          else
            echo "Mode '${RELEASE_MODE}' on branch '${RELEASE_BRANCH}': no tag or release will be created."
          fi

          if [[ "${RELEASE_MODE}" != "test-build" ]]; then
            if git rev-parse --verify --quiet "refs/tags/${RELEASE_TAG}"; then
              echo "Tag ${RELEASE_TAG} already exists." >&2
              exit 1
            fi
            if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
              echo "A GitHub release for ${RELEASE_TAG} already exists." >&2
              exit 1
            fi

            unexpected_changes="$(
              git diff --name-only "${CURRENT_BUMP}..${RELEASE_COMMIT}" \
                | grep -Ev '^(\.github/workflows/(mobile-release|update-store-source)\.yml|store\.json|scripts/(build-ios-ipa|generate-release-notes|prepare-ios-dependencies|release-metadata)\.sh|scripts/update-store-source\.py)$' \
                || true
            )"
            if [[ -n "${unexpected_changes}" ]]; then
              echo "The version bump must be the final application change before release." >&2
              echo "Unexpected files changed after the bump:" >&2
              echo "${unexpected_changes}" >&2
              exit 1
            fi
          fi

          if [[ "${RELEASE_MODE}" != "dry-run" ]]; then
            required_secrets=(
              RELEASE_PROPERTIES_BASE64
              RELEASE_KEYSTORE_BASE64
            )
            missing=()
            for secret_name in "${required_secrets[@]}"; do
              if [[ -z "${!secret_name}" ]]; then
                missing+=("${secret_name}")
              fi
            done
            if (( ${#missing[@]} > 0 )); then
              printf 'Missing required release secrets: %s\n' "${missing[*]}" >&2
              exit 1
            fi
          fi

      - name: Generate release notes
        env:
          PREVIOUS_BUMP: ${{ steps.release.outputs.previous_bump }}
          EXCLUDE_COMMITS: ${{ inputs.exclude_commits }}
          NOTES_FROM: ${{ inputs.notes_from }}
          UPSTREAM_URL: https://github.com/NuvioMedia/NuvioMobile.git
          UPSTREAM_BRANCH: cmp-rewrite
        run: |
          notes_to="${GITHUB_SHA}"
          notes_from="$(printf '%s' "${NOTES_FROM}" | tr -d '[:space:]')"
          if [[ -n "${notes_from}" ]]; then
            if ! git cat-file -e "${notes_from}^{commit}" 2>/dev/null; then
              echo "notes_from commit not found: ${notes_from}" >&2
              exit 1
            fi
            if ! git merge-base --is-ancestor "${notes_from}" "${notes_to}"; then
              echo "notes_from ${notes_from} is not an ancestor of ${GITHUB_REF_NAME}." >&2
              exit 1
            fi
            echo "Release notes start after the given commit ${notes_from}."
          else
            notes_from="$(git log "${notes_to}" -n 1 --format=%H --grep='^chore(store): publish ')"
            if [[ -n "${notes_from}" ]]; then
              echo "Release notes start after the last store publish commit ${notes_from}."
            else
              notes_from="${PREVIOUS_BUMP}"
              echo "No store publish commit on this branch; starting after the previous version bump ${notes_from}."
            fi
          fi

          exclude_ref_args=()
          if git fetch --no-tags --quiet "${UPSTREAM_URL}" "${UPSTREAM_BRANCH}:refs/remotes/upstream/${UPSTREAM_BRANCH}"; then
            exclude_ref_args=(--exclude-ref "refs/remotes/upstream/${UPSTREAM_BRANCH}")
          else
            echo "::warning::Could not fetch upstream; release notes may include upstream commits."
          fi

          ./scripts/generate-release-notes.sh \
            --from "${notes_from}" \
            --to "${notes_to}" \
            --repository "${GITHUB_REPOSITORY}" \
            --exclude "${EXCLUDE_COMMITS}" \
            "${exclude_ref_args[@]}" \
            > release-notes.md

          if [[ ! -s release-notes.md ]]; then
            echo "No release-note commits were found." >&2
            exit 1
          fi

          {
            echo "## ${{ steps.release.outputs.version }} release notes"
            echo
            cat release-notes.md
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload release notes
        if: inputs.mode != 'dry-run'
        uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  android:
    name: Build Android APKs
    if: inputs.mode != 'dry-run' && (inputs.target == 'all' || inputs.target == 'android-only')
    needs: prepare
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.tag }}
      RELEASE_PROPERTIES_BASE64: ${{ secrets.NUVIO_LOCAL_PROPERTIES_BASE64 }}
      RELEASE_KEYSTORE_BASE64: ${{ secrets.NUVIO_RELEASE_KEYSTORE_BASE64 }}
      CONTRIBUTIONS_URL: https://api.github.com/repos/luqmanfadlli/NuvioMobile-Enhanced/contributors?per_page=100

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Configure release properties
        run: |
          keystore_path="${RUNNER_TEMP}/nuvio-release.jks"
          printf '%s' "${RELEASE_KEYSTORE_BASE64}" | base64 --decode > "${keystore_path}"
          printf '%s' "${RELEASE_PROPERTIES_BASE64}" | base64 --decode > local.properties

          sed -i -E '/^[[:space:]]*(sdk\.dir|NUVIO_RELEASE_STORE_FILE)[[:space:]]*=/d' local.properties
          printf '\nNUVIO_RELEASE_STORE_FILE=%s\n' "${keystore_path}" >> local.properties
          if [[ -n "${CONTRIBUTIONS_URL}" ]]; then
            printf 'CONTRIBUTIONS_URL=%s\n' "${CONTRIBUTIONS_URL}" >> local.properties
          fi

          required_properties=(
            NUVIO_RELEASE_STORE_PASSWORD
            NUVIO_RELEASE_KEY_ALIAS
            NUVIO_RELEASE_KEY_PASSWORD
            TRAKT_CLIENT_ID
            TRAKT_CLIENT_SECRET
            SIMKL_CLIENT_ID
          )
          for property_name in "${required_properties[@]}"; do
            if ! grep -Eq "^${property_name}=.+" local.properties; then
              echo "Missing required property: ${property_name}" >&2
              exit 1
            fi
          done

      - name: Set up Rust
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android
          cargo install cargo-ndk --locked

      - name: Build full release APKs
        run: ./gradlew :androidApp:assembleFullRelease -Pnuvio.app.versionName="${RELEASE_VERSION}" --stacktrace

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v7
        with:
          name: nuvio-${{ needs.prepare.outputs.version }}-android-full-release
          path: androidApp/build/outputs/apk/full/release/*.apk
          if-no-files-found: error

  ios:
    name: Build iOS IPA
    if: inputs.mode != 'dry-run' && (inputs.target == 'all' || inputs.target == 'ios-only')
    needs: prepare
    runs-on: xcode-27
    timeout-minutes: 180
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      GRADLE_OPTS: -Dfile.encoding=UTF-8
      KOTLIN_DAEMON_JVMARGS: -Xmx1024M
      NUVIO_GRADLE_JVMARGS: -Xmx2048M -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=768M -XX:+UseG1GC
      NUVIO_KOTLIN_NATIVE_JVMARGS: -Xmx9216M -XX:+UseG1GC
      NUVIO_IOS_PHASE_PROFILE: ${{ inputs.ios_disable_phases }}
      RELEASE_PROPERTIES_BASE64: ${{ secrets.NUVIO_LOCAL_PROPERTIES_BASE64 }}
      CONTRIBUTIONS_URL: ${{ secrets.CONTRIBUTIONS_URL }}

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Cache Kotlin Native
        uses: actions/cache@v5
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            konan-${{ runner.os }}-${{ runner.arch }}-

      - name: Verify Apple toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Configure runtime properties
        run: |
          printf '%s' "${RELEASE_PROPERTIES_BASE64}" | base64 --decode > local.properties
          sed -i '' -E '/^[[:space:]]*(sdk\.dir|NUVIO_RELEASE_STORE_FILE)[[:space:]]*=/d' local.properties
          if [[ -n "${CONTRIBUTIONS_URL}" ]]; then
            printf 'CONTRIBUTIONS_URL=%s\n' "${CONTRIBUTIONS_URL}" >> local.properties
          fi

      - name: Constrain Gradle memory for the hosted runner
        run: |
          gradle_user_home="${GRADLE_USER_HOME:-${HOME}/.gradle}"
          mkdir -p "${gradle_user_home}"
          {
            echo "org.gradle.jvmargs=${NUVIO_GRADLE_JVMARGS}"
            echo "kotlin.daemon.jvmargs=${KOTLIN_DAEMON_JVMARGS}"
            echo "kotlin.native.jvmArgs=${NUVIO_KOTLIN_NATIVE_JVMARGS}"
            echo "org.gradle.parallel=false"
            echo "org.gradle.workers.max=1"
            echo "kotlin.native.disableCompilerDaemon=true"
            case "${NUVIO_IOS_PHASE_PROFILE:-skip-both}" in
              full) NUVIO_IOS_DISABLE_PHASES="" ;;
              skip-static-init) NUVIO_IOS_DISABLE_PHASES="RemoveRedundantCallsToStaticInitializersPhase" ;;
              skip-devirtualization) NUVIO_IOS_DISABLE_PHASES="DevirtualizationAnalysis,Devirtualization" ;;
              *) NUVIO_IOS_DISABLE_PHASES="DevirtualizationAnalysis,Devirtualization,RemoveRedundantCallsToStaticInitializersPhase" ;;
            esac
            if [ -n "${NUVIO_IOS_DISABLE_PHASES}" ]; then
              echo "nuvio.ios.releaseDisablePhases=${NUVIO_IOS_DISABLE_PHASES}"
            fi
          } >> "${gradle_user_home}/gradle.properties"
          cat "${gradle_user_home}/gradle.properties"

      - name: Prepare iOS dependencies
        run: ./scripts/prepare-ios-dependencies.sh

      - name: Build unsigned full IPA
        run: |
          (
            while sleep 60; do
              echo "::group::Build resources $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
              uptime
              vm_stat
              ps -Ao pid,etime,%cpu,rss,command -r | head -n 12 || true
              echo "::endgroup::"
            done
          ) &
          monitor_pid=$!
          trap 'kill "${monitor_pid}" 2>/dev/null || true' EXIT
          ./scripts/build-ios-ipa.sh "${{ needs.prepare.outputs.version }}"

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v7
        with:
          name: nuvio-${{ needs.prepare.outputs.version }}-ios-full-release
          path: build/ios-ipa/*.ipa
          if-no-files-found: error

  # Creates the release with the APKs as soon as Android succeeds — does not wait for iOS.
  release:
    name: Create ${{ inputs.mode }} release
    if: (inputs.mode == 'draft' || inputs.mode == 'publish') && (inputs.target == 'all' || inputs.target == 'android-only')
    needs:
      - prepare
      - android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_MODE: ${{ inputs.mode }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.tag }}
      RELEASE_BRANCH: ${{ github.ref_name }}

    steps:
      - name: Download release notes
        uses: actions/download-artifact@v8
        with:
          name: release-notes
          path: release-assets

      - name: Download Android artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: nuvio-*-android-full-release
          path: release-assets
          merge-multiple: true

      - name: Create GitHub release
        run: |
          mapfile -t release_files < <(find release-assets -maxdepth 1 -type f -name '*.apk' -print | sort)
          if (( ${#release_files[@]} == 0 )); then
            echo "No Android packages were produced." >&2
            exit 1
          fi

          release_args=(
            "${RELEASE_TAG}"
            --repo "${GITHUB_REPOSITORY}"
            --target "${RELEASE_BRANCH}"
            --title "${RELEASE_VERSION}"
            --notes-file release-assets/release-notes.md
          )
          if [[ "${RELEASE_MODE}" == "draft" ]]; then
            release_args+=(--draft)
          fi
          gh release create "${release_args[@]}" "${release_files[@]}"

  # Attaches the IPA to the release created above once iOS finishes.
  # For ios-only runs there is no Android release, so this job creates the release itself.
  release-ios:
    name: Attach iOS IPA to ${{ inputs.mode }} release
    if: >-
      always()
      && (inputs.mode == 'draft' || inputs.mode == 'publish')
      && needs.prepare.result == 'success'
      && needs.ios.result == 'success'
      && (needs.release.result == 'success' || inputs.target == 'ios-only')
    needs:
      - prepare
      - ios
      - release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_MODE: ${{ inputs.mode }}
      RELEASE_TARGET: ${{ inputs.target }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.tag }}
      RELEASE_BRANCH: ${{ github.ref_name }}

    steps:
      - name: Download release notes
        uses: actions/download-artifact@v8
        with:
          name: release-notes
          path: release-assets

      - name: Download iOS artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: nuvio-*-ios-full-release
          path: release-assets
          merge-multiple: true

      - name: Attach IPA to GitHub release
        run: |
          mapfile -t ipa_files < <(find release-assets -maxdepth 1 -type f -name '*.ipa' -print | sort)
          if (( ${#ipa_files[@]} == 0 )); then
            echo "No iOS packages were produced." >&2
            exit 1
          fi

          if [[ "${RELEASE_TARGET}" == "ios-only" ]]; then
            release_args=(
              "${RELEASE_TAG}"
              --repo "${GITHUB_REPOSITORY}"
              --target "${RELEASE_BRANCH}"
              --title "${RELEASE_VERSION}"
              --notes-file release-assets/release-notes.md
            )
            if [[ "${RELEASE_MODE}" == "draft" ]]; then
              release_args+=(--draft)
            fi
            gh release create "${release_args[@]}" "${ipa_files[@]}"
          else
            gh release upload "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --clobber "${ipa_files[@]}"
          fi

  store:
    name: Update sideload source
    if: always() && inputs.mode == 'publish' && needs.prepare.result == 'success' && needs.release-ios.result == 'success'
    needs:
      - prepare
      - release-ios
    permissions:
      contents: write
    uses: ./.github/workflows/update-store-source.yml
    with:
      tag: ${{ needs.prepare.outputs.tag }}
      version: ${{ needs.prepare.outputs.version }}
